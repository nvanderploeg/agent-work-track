services:
  app:
    image: ghcr.io/nvanderploeg/chronicle:${CHRONICLE_TAG:-latest}
    restart: unless-stopped
    environment:
      # postgres://user:pw@host:5432/chronicle?sslmode=verify-full; hex password (see deploy/README.md).
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/chronicle.env}
      ORIGIN: ${ORIGIN:?set ORIGIN in deploy/chronicle.env}
      CHRONICLE_IDLE_MS: ${CHRONICLE_IDLE_MS:-}
      CHRONICLE_HEARTBEAT_MS: ${CHRONICLE_HEARTBEAT_MS:-}
      CHRONICLE_WRITES_PER_WINDOW: ${CHRONICLE_WRITES_PER_WINDOW:-}
      CHRONICLE_WRITE_WINDOW_MS: ${CHRONICLE_WRITE_WINDOW_MS:-}
      # Set by deploy/nginx; without it every client shares the proxy's write limit.
      ADDRESS_HEADER: x-real-ip
      # Unset: /admin and its endpoints answer 404.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Unset: sign-in is off and every Project is anonymous.
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      FIREBASE_SERVICE_ACCOUNT_FILE: /run/secrets/firebase-service-account.json
      # One setting sizes the import limit and the node adapter's body limit; keep nginx in step.
      ADMIN_MAX_BUNDLE_MB: ${ADMIN_MAX_BUNDLE_MB:-256}
      BODY_SIZE_LIMIT: ${ADMIN_MAX_BUNDLE_MB:-256}M
    volumes:
      - backups:/backups
      - ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:-/dev/null}:/run/secrets/firebase-service-account.json:ro
    ports:
      - '127.0.0.1:3280:3000'

volumes:
  backups:
